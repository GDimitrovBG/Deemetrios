    Preloading them put three woff2 files at High priority in the same instant
    as the LCP image, on a connection that has to carry both. And it bought
    almost nothing: font-display is swap, so text paints in the fallback
    immediately either way, and the fallbacks in styles.css carry size-adjust
    metrics so the swap does not move anything. The only gain was swapping a
    few hundred ms sooner; the cost was bandwidth taken from the image the
    page is measured on.
  -->

  </script>

  <!--
    Deferred third-party loader — mobile Core Web Vitals.
    gtag.js + fbevents.js are the heaviest main-thread cost during first paint.
    We load them only after the first user interaction, or on idle (≤5s) so
    bounces still register. All gtag()/fbq() calls above are already queued, so
    they flush the instant the libraries arrive — no lost PageViews, no consent
    leak (consent defaults were set synchronously above).
  -->
  <script>
    (function () {
      // Skip entirely during prerender — otherwise the injected <script> tags
      // get serialized into the static HTML and would load eagerly for real
      // users, defeating the whole point. __PRERENDER__ is set before any page
      // script runs (scripts/prerender.js → evaluateOnNewDocument).
      if (window.__PRERENDER__) return;
      var loaded = false;
      function loadThirdParty() {
        if (loaded) return; loaded = true;
        var g = document.createElement('script'); g.async = true;
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-RB14REHZ0P';
        document.head.appendChild(g);
        var f = document.createElement('script'); f.async = true;
        f.src = 'https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(f);
      }
      var evs = ['pointerdown', 'keydown', 'touchstart', 'scroll', 'mousemove'];
      function onFirst() {
        evs.forEach(function (e) { window.removeEventListener(e, onFirst, { passive: true }); });
        loadThirdParty();
      }
      evs.forEach(function (e) { window.addEventListener(e, onFirst, { passive: true }); });
      if ('requestIdleCallback' in window) requestIdleCallback(loadThirdParty, { timeout: 5000 });
      else setTimeout(loadThirdParty, 4000);
    })();
  </script>
  <!-- Pixel <noscript> fallback omitted: this is a React SPA, so no-JS visitors
       see nothing anyway and Meta will never receive a hit from them. -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
